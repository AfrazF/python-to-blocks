<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />
    <title>Python to Blocks</title>
  </head>
  <body>
    <div id="app">
      <aside id="sidebar"></aside>
      <main id="editor-area">
        <div
          id="tab-bar"
          class="tab-bar"
          role="tablist"
          aria-label="Open files"
          hidden
        ></div>
        <div id="workspace-row">
          <div id="blockly"></div>
          <div id="editor-splitter"></div>
          <div id="editor"></div>
        </div>
      </main>
    </div>
    <div id="editable-badge" style="display: none">EDITABLE</div>
    <div id="app-controls">
      <button
        id="toggle-editor-btn"
        type="button"
        title="Show code"
        aria-label="Show code"
      >
        <svg
          class="code-icon"
          viewBox="0 -960 960 960"
          width="22"
          height="22"
          aria-hidden="true"
        >
          <path
            class="code-chevron-left"
            d="M240-280 40-480l200-200 56 56-143 144 143 144-56 56Z"
          />
          <path
            class="code-slash icon-slash"
            pathLength="1"
            d="M380-160 580-800"
          />
          <path
            class="code-chevron-right"
            d="M720-280l-56-56 143-144-143-144 56-56 200 200-200 200Z"
          />
        </svg>
      </button>
      <button
        id="theme-toggle-btn"
        type="button"
        title="Toggle theme"
        aria-label="Toggle theme"
      >
        <span
          class="material-symbols-outlined theme-icon theme-icon-sun"
          aria-hidden="true"
          >light_mode</span
        >
        <span
          class="material-symbols-outlined theme-icon theme-icon-moon"
          aria-hidden="true"
          >dark_mode</span
        >
      </button>
      <button
        id="toggle-blocks-btn"
        type="button"
        title="Hide blocks"
        aria-label="Hide blocks"
        aria-pressed="false"
      >
        <svg
          class="blocks-icon"
          viewBox="0 -960 960 960"
          width="22"
          height="22"
          aria-hidden="true"
        >
          <path
            d="m384-336 56-57-87-87 87-87-56-57-144 144 144 144Zm192 0 144-144-144-144-56 57 87 87-87 87 56 57ZM200-120q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h560q33 0 56.5 23.5T840-760v560q0 33-23.5 56.5T760-120H200Zm0-80h560v-560H200v560Zm0-560v560-560Z"
          />
          <path
            class="blocks-slash icon-slash"
            pathLength="1"
            d="M84-820 820-84"
          />
        </svg>
      </button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
