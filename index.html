<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />
    <title>Python to Blocks</title>
  </head>
  <body>
    <div id="app">
      <aside id="sidebar"></aside>
      <main id="workspace-container">
        <div id="blockly"></div>
        <div id="editor-splitter"></div>
        <div id="editor"></div>
      </main>
    </div>
    <div id="app-controls">
      <button
        id="toggle-editor-btn"
        type="button"
        title="Show code"
        aria-label="Show code"
      >
        <span class="material-symbols-outlined">code_xml</span>
      </button>
      <button
        id="theme-toggle-btn"
        type="button"
        title="Toggle theme"
        aria-label="Toggle theme"
      >
        <span class="material-symbols-outlined" id="theme-icon"
          >light_mode</span
        >
      </button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
