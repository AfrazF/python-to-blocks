<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 56" width="720" height="56" role="img" aria-label="Drive base setup block mockup">
  <title>Drive base setup block — proposed shape</title>

  <!-- Block body: Output blue fill, darker stroke, top notch, bottom tab -->
  <path d="M 8,0 L 16,0 L 20,6 L 36,6 L 40,0 L 712,0 Q 720,0 720,8 L 720,48 Q 720,56 712,56 L 40,56 L 36,50 L 20,50 L 16,56 L 8,56 Q 0,56 0,48 L 0,8 Q 0,0 8,0 Z"
        fill="#4c97ff" stroke="#3971bf" stroke-width="2"/>

  <!-- Leading icon: drive base (body + two wheels) -->
  <g fill="#ffffff">
    <rect x="16" y="19" width="20" height="10" rx="2"/>
    <circle cx="20" cy="34" r="4"/>
    <circle cx="32" cy="34" r="4"/>
  </g>

  <!-- Divider between icon and the rest of the block -->
  <line x1="48" y1="12" x2="48" y2="44" stroke="#ffffff" stroke-opacity="0.45" stroke-width="1.5"/>

  <!-- Square field: drive base name (darker blue, white text) -->
  <rect x="56" y="14" width="126" height="28" rx="6" fill="#4180d9"/>
  <text x="119" y="28" text-anchor="middle" dominant-baseline="central"
        font-family="Helvetica Neue, Segoe UI, Helvetica, sans-serif" font-weight="bold" font-size="13" fill="#ffffff">drive base name</text>

  <!-- Static label -->
  <text x="190" y="28" dominant-baseline="central"
        font-family="Helvetica Neue, Segoe UI, Helvetica, sans-serif" font-weight="bold" font-size="13" fill="#ffffff">left</text>

  <!-- Circular dropdown: left motor -->
  <rect x="216" y="14" width="44" height="28" rx="14" fill="#4180d9"/>
  <text x="230" y="28" text-anchor="middle" dominant-baseline="central"
        font-family="Helvetica Neue, Segoe UI, Helvetica, sans-serif" font-weight="bold" font-size="13" fill="#ffffff">l</text>
  <path d="M 240,26 L 248,26 L 244,32 Z" fill="#ffffff"/>

  <!-- Static label -->
  <text x="268" y="28" dominant-baseline="central"
        font-family="Helvetica Neue, Segoe UI, Helvetica, sans-serif" font-weight="bold" font-size="13" fill="#ffffff">right</text>

  <!-- Circular dropdown: right motor -->
  <rect x="294" y="14" width="44" height="28" rx="14" fill="#4180d9"/>
  <text x="308" y="28" text-anchor="middle" dominant-baseline="central"
        font-family="Helvetica Neue, Segoe UI, Helvetica, sans-serif" font-weight="bold" font-size="13" fill="#ffffff">r</text>
  <path d="M 318,26 L 326,26 L 322,32 Z" fill="#ffffff"/>

  <!-- Static label -->
  <text x="346" y="28" dominant-baseline="central"
        font-family="Helvetica Neue, Segoe UI, Helvetica, sans-serif" font-weight="bold" font-size="13" fill="#ffffff">with</text>

  <!-- Icon: wheel diameter (circle with vertical diameter arrow) -->
  <g stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round">
    <circle cx="380" cy="28" r="9"/>
    <line x1="380" y1="17" x2="380" y2="39"/>
    <path d="M 377,20 L 380,16 L 383,20"/>
    <path d="M 377,36 L 380,40 L 383,36"/>
  </g>

  <!-- Circular field: wheel diameter -->
  <rect x="396" y="14" width="132" height="28" rx="14" fill="#4180d9"/>
  <text x="462" y="28" text-anchor="middle" dominant-baseline="central"
        font-family="Helvetica Neue, Segoe UI, Helvetica, sans-serif" font-weight="bold" font-size="13" fill="#ffffff">wheel diameter</text>

  <!-- Static label -->
  <text x="536" y="28" dominant-baseline="central"
        font-family="Helvetica Neue, Segoe UI, Helvetica, sans-serif" font-weight="bold" font-size="13" fill="#ffffff">and</text>

  <!-- Icon: axle length (horizontal double arrow between two ticks) -->
  <g stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round">
    <line x1="562" y1="28" x2="578" y2="28"/>
    <path d="M 565,25 L 561,28 L 565,31"/>
    <path d="M 575,25 L 579,28 L 575,31"/>
    <line x1="561" y1="20" x2="561" y2="36"/>
    <line x1="579" y1="20" x2="579" y2="36"/>
  </g>

  <!-- Circular field: axle length -->
  <rect x="586" y="14" width="118" height="28" rx="14" fill="#4180d9"/>
  <text x="645" y="28" text-anchor="middle" dominant-baseline="central"
        font-family="Helvetica Neue, Segoe UI, Helvetica, sans-serif" font-weight="bold" font-size="13" fill="#ffffff">axle length</text>
</svg>
